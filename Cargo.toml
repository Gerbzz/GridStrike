[package]
name = "gridstrike"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"], optional = true }

[features]
native-ui = ["dep:eframe"]

[[bin]]
name = "gridstrike-native"
path = "src/bin/gridstrike-native.rs"
required-features = ["native-ui"]

